<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>中国象棋</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --wood-light: #f0d3a0;
  --wood-mid: #e0b878;
  --wood-dark: #c89858;
  --wood-line: #5a3a1a;
  --red-piece: #d63030;
  --black-piece: #2a2a2a;
  --cell-size: 44px;
  --piece-size: 40px;
  --board-pad: 22px;
}
html, body {
  font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  background: #2b1d10;
  color: #f5e6c8;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.app {
  max-width: 980px;
  margin: 0 auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
header {
  text-align: center;
  padding: 8px 0 2px;
}
header h1 {
  font-size: 26px;
  letter-spacing: 6px;
  color: #ffd98a;
  text-shadow: 0 2px 4px rgba(0,0,0,.5);
}
header .sub {
  font-size: 12px;
  color: #b89868;
  margin-top: 4px;
  letter-spacing: 2px;
}
.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 16px;
  align-items: start;
}
.board-wrap {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-width: 0;
  width: 100%;
  overflow: hidden;
}
.panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}
.turn-box {
  background: linear-gradient(135deg, #3a2a14, #2a1d0c);
  border: 1px solid #5a3a1a;
  border-radius: 10px;
  padding: 12px 14px;
  text-align: center;
}
.turn-box .label { font-size: 12px; color: #b89868; letter-spacing: 2px; }
.turn-box .who {
  font-size: 22px;
  font-weight: 700;
  margin-top: 6px;
  letter-spacing: 4px;
  transition: color .2s;
}
.turn-box .who.red { color: #ff6b6b; text-shadow: 0 0 8px rgba(255, 80, 80, .4); }
.turn-box .who.black { color: #e8e8e8; text-shadow: 0 0 8px rgba(255, 255, 255, .2); }
.turn-box .check-tip {
  margin-top: 6px;
  font-size: 13px;
  color: #ff5a3c;
  font-weight: 700;
  letter-spacing: 2px;
  min-height: 18px;
  animation: blink 1s steps(2, start) infinite;
}
@keyframes blink {
  50% { opacity: .35; }
}
.status-bar {
  text-align: center;
  font-size: 14px;
  min-height: 20px;
  color: #ffd98a;
  font-weight: 600;
  letter-spacing: 1px;
}
.status-bar.thinking { color: #8ad0ff; }
.status-bar.thinking::after {
  content: "";
  display: inline-block;
  width: 1.2em;
  text-align: left;
  animation: dots 1.2s steps(4, end) infinite;
}
@keyframes dots {
  0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75%,100% { content: "..."; }
}
.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.buttons button {
  padding: 10px 0;
  font-size: 14px;
  font-family: inherit;
  border: 1px solid #7a5a2a;
  border-radius: 8px;
  background: linear-gradient(180deg, #4a3418, #38260f);
  color: #ffd98a;
  cursor: pointer;
  transition: all .15s;
  letter-spacing: 2px;
}
.buttons button:hover { background: linear-gradient(180deg, #5a4220, #48301a); box-shadow: 0 0 10px rgba(255,200,100,.25); }
.buttons button:active { transform: translateY(1px); }
.buttons button:disabled { opacity: .4; cursor: not-allowed; }
/* 模式切换 */
.mode-switch {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  border: 1px solid #7a5a2a;
  border-radius: 8px;
  overflow: hidden;
  background: #2a1d0c;
}
.mode-switch button {
  padding: 9px 0;
  font-size: 13px;
  font-family: inherit;
  border: none;
  background: transparent;
  color: #b89868;
  cursor: pointer;
  transition: all .15s;
  letter-spacing: 2px;
}
.mode-switch button.active {
  background: linear-gradient(180deg, #6a4a20, #4a3210);
  color: #ffd98a;
  box-shadow: 0 0 12px rgba(255,200,100,.3) inset;
}
.captured-box {
  background: rgba(0,0,0,.25);
  border: 1px solid #5a3a1a;
  border-radius: 8px;
  padding: 8px 10px;
}
.captured-box h3 {
  font-size: 12px;
  color: #b89868;
  margin-bottom: 6px;
  letter-spacing: 2px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.captured-box h3 .score {
  color: #ffd98a;
  font-weight: 700;
}
.captured-list {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  min-height: 24px;
}
.cap-piece {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  background: radial-gradient(circle at 35% 35%, #f5e0b0, #d4a85a);
  box-shadow: 0 1px 2px rgba(0,0,0,.4);
}
.cap-piece.red { color: var(--red-piece); }
.cap-piece.black { color: var(--black-piece); }
.history-box {
  background: rgba(0,0,0,.25);
  border: 1px solid #5a3a1a;
  border-radius: 8px;
  padding: 8px 10px;
  flex: 1;
  min-height: 120px;
  display: flex;
  flex-direction: column;
}
.history-box h3 {
  font-size: 12px;
  color: #b89868;
  margin-bottom: 6px;
  letter-spacing: 2px;
}
.history-list {
  flex: 1;
  overflow-y: auto;
  max-height: 260px;
  font-size: 13px;
  line-height: 1.8;
}
.history-list::-webkit-scrollbar { width: 6px; }
.history-list::-webkit-scrollbar-thumb { background: #5a3a1a; border-radius: 3px; }
.history-row {
  display: grid;
  grid-template-columns: 28px 1fr 1fr;
  gap: 4px;
  padding: 1px 0;
}
.history-row .num { color: #8a6a3a; text-align: right; }
.history-row .move.red { color: #ff8585; }
.history-row .move.black { color: #e8e8e8; }
.history-empty { color: #6a5a3a; font-size: 12px; text-align: center; padding: 20px 0; }

/* === 棋盘 === */
.board {
  position: relative;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(255,240,200,.15), transparent 60%),
    linear-gradient(135deg, var(--wood-mid), var(--wood-light) 40%, var(--wood-dark));
  border: 3px solid #6a3a12;
  border-radius: 6px;
  padding: var(--board-pad);
  width: 100%;
  aspect-ratio: 9 / 10; /* 9列 x 10行，含边框由 box-sizing 处理 */
  box-shadow:
    0 0 2px #8a5a22 inset,
    0 0 4px #3a1d08 inset,
    0 8px 30px rgba(0,0,0,.6);
  touch-action: manipulation;
  user-select: none;
}
/* 木纹理 */
.board::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 6px;
  background:
    repeating-linear-gradient(92deg,
      rgba(120,80,40,.05) 0px, rgba(120,80,40,.05) 2px,
      transparent 2px, transparent 9px),
    repeating-linear-gradient(88deg,
      rgba(200,150,80,.04) 0px, rgba(200,150,80,.04) 1px,
      transparent 1px, transparent 13px);
  pointer-events: none;
}
.grid-svg {
  position: absolute;
  top: var(--board-pad);
  left: var(--board-pad);
  width: calc(100% - var(--board-pad) * 2);
  height: calc(100% - var(--board-pad) * 2);
  pointer-events: none;
}
/* 棋盘线条使用 non-scaling-stroke，保证缩放时线宽一致，不会被压扁 */
.grid-svg line, .grid-svg polyline {
  vector-effect: non-scaling-stroke;
}
.river-text {
  position: absolute;
  top: 40%;
  left: var(--board-pad);
  width: calc(100% - var(--board-pad) * 2);
  height: 10%;
  display: flex;
  align-items: center;
  justify-content: space-around;
  font-size: clamp(13px, 2.6vw, 24px);
  letter-spacing: 0.35em;
  text-indent: 0.35em;
  color: var(--wood-line);
  opacity: .78;
  font-weight: 700;
  pointer-events: none;
  z-index: 1;
}
.pieces-layer {
  position: absolute;
  top: var(--board-pad);
  left: var(--board-pad);
  width: calc(100% - var(--board-pad) * 2);
  height: calc(100% - var(--board-pad) * 2);
  z-index: 2;
  container-type: inline-size;
}
.piece {
  position: absolute;
  width: 11%;
  aspect-ratio: 1;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-size: 5cqw;
  font-weight: 700;
  font-family: "KaiTi", "STKaiti", "PingFang SC", "Microsoft YaHei", serif;
  background: radial-gradient(circle at 35% 32%, #fbeecd, #f0d3a0 55%, #d9ae62);
  border: 2px solid #8a5a22;
  box-shadow: 0 2px 5px rgba(0,0,0,.45), 0 0 2px rgba(0,0,0,.4) inset;
  cursor: pointer;
  transition: transform .12s, box-shadow .12s;
  z-index: 2;
}
.piece::after {
  content: "";
  position: absolute;
  inset: 9%;
  border-radius: 50%;
  border: 1px solid rgba(120, 75, 25, .55);
  pointer-events: none;
}
.piece.red { color: var(--red-piece); }
.piece.black { color: var(--black-piece); }
.piece.selected {
  transform: translate(-50%, -50%) scale(1.14);
  box-shadow: 0 0 0 3px rgba(255, 215, 110, .95), 0 4px 10px rgba(0,0,0,.5);
  z-index: 4;
}
.piece.in-check {
  animation: blink .5s steps(2, start) infinite;
  box-shadow: 0 0 0 3px rgba(255, 60, 40, .95), 0 2px 6px rgba(0,0,0,.5);
}
.last-move {
  position: absolute;
  width: 12.2%;
  aspect-ratio: 1;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  border: 2px dashed rgba(255, 235, 170, .85);
  pointer-events: none;
  z-index: 1;
}
.hint {
  position: absolute;
  width: 3.4%;
  aspect-ratio: 1;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background: rgba(43, 160, 70, .9);
  box-shadow: 0 0 6px rgba(43, 160, 70, .8);
  pointer-events: none;
  z-index: 3;
}
.hint.capture {
  width: 12.4%;
  background: transparent;
  border: 3px solid rgba(224, 49, 49, .95);
  box-shadow: 0 0 10px rgba(224, 49, 49, .6);
}
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 5, 0, .6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 50;
  padding: 16px;
}
.overlay.show { display: flex; }
.overlay-card {
  background: linear-gradient(160deg, #3a2a14, #241708);
  border: 2px solid #d9ae62;
  border-radius: 14px;
  padding: 28px 34px;
  text-align: center;
  box-shadow: 0 12px 40px rgba(0,0,0,.7);
  max-width: 92vw;
}
.overlay-card .big {
  font-size: 30px;
  letter-spacing: 6px;
  color: #ffd98a;
  font-weight: 700;
  margin-bottom: 8px;
}
.overlay-card .small { font-size: 14px; color: #d8bd8a; margin-bottom: 18px; }
.overlay-card .row { display: flex; gap: 10px; justify-content: center; }
.overlay-card button {
  padding: 9px 18px;
  font-size: 14px;
  font-family: inherit;
  border: 1px solid #7a5a2a;
  border-radius: 8px;
  background: linear-gradient(180deg, #4a3418, #38260f);
  color: #ffd98a;
  cursor: pointer;
  letter-spacing: 2px;
}
.foot {
  text-align: center;
  font-size: 12px;
  color: #8a6a3a;
  letter-spacing: 1px;
  padding-bottom: 10px;
}
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .board { max-width: 560px; margin: 0 auto; width: 100%; }
  .history-list { max-height: 180px; }
  header h1 { font-size: 22px; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>中国象棋</h1>
    <div class="sub">XIANGQI · 红先黑后 · 落子无悔</div>
  </header>

  <div class="status-bar" id="statusBar">红方先行</div>

  <div class="layout">
    <div class="board-wrap">
      <div class="board" id="board">
        <svg class="grid-svg" id="gridSvg" viewBox="0 0 800 900" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div class="river-text"><span>楚&nbsp;河</span><span>漢&nbsp;界</span></div>
        <div class="pieces-layer" id="piecesLayer"></div>
      </div>
    </div>

    <aside class="panel">
      <div class="turn-box">
        <div class="label">当前回合</div>
        <div class="who red" id="turnWho">红 方</div>
        <div class="check-tip" id="checkTip"></div>
      </div>

      <div class="mode-switch" role="group" aria-label="对弈模式">
        <button id="modePvp" class="active" type="button">双人对弈</button>
        <button id="modePvc" type="button">单人对电脑</button>
      </div>

      <div class="buttons">
        <button id="undoBtn" type="button">悔 棋</button>
        <button id="restartBtn" type="button">重新开始</button>
      </div>

      <div class="captured-box">
        <h3>红方战利品 <span class="score" id="scoreRed"></span></h3>
        <div class="captured-list" id="capByRed"><span class="history-empty">暂无</span></div>
      </div>
      <div class="captured-box">
        <h3>黑方战利品 <span class="score" id="scoreBlack"></span></h3>
        <div class="captured-list" id="capByBlack"><span class="history-empty">暂无</span></div>
      </div>

      <div class="history-box">
        <h3>走子记录</h3>
        <div class="history-list" id="historyList"><div class="history-empty">尚未落子</div></div>
      </div>
    </aside>
  </div>

  <div class="foot">单文件静态网页 · 规则含蹩马腿 / 塞象眼 / 炮架 / 飞将照面 · 由 WorkBuddy 生成初版，王二止补完并校验</div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <div class="big" id="overlayTitle">红方胜</div>
    <div class="small" id="overlayText">将死</div>
    <div class="row">
      <button id="overlayRestart" type="button">再来一局</button>
      <button id="overlayClose" type="button">关闭复盘</button>
    </div>
  </div>
</div>

<script>
"use strict";
/*ENGINE-BEGIN*/
/* ===== 纯规则引擎（不依赖 DOM，可独立校验） ===== */
var CHARS = {
  r: { K: "帥", A: "仕", B: "相", N: "馬", R: "車", C: "炮", P: "兵" },
  b: { K: "將", A: "士", B: "象", N: "馬", R: "車", C: "砲", P: "卒" }
};
var VALUES = { K: 100000, R: 600, C: 300, N: 270, B: 120, A: 120, P: 60 };
var CN_NUM = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九"];

function emptyBoard() {
  var b = [], y, x;
  for (y = 0; y < 10; y++) { b.push([]); for (x = 0; x < 9; x++) b[y].push(null); }
  return b;
}
function put(b, x, y, side, type) { b[y][x] = { s: side, t: type }; }
function initialBoard() {
  var b = emptyBoard(), back = ["R", "N", "B", "A", "K", "A", "B", "N", "R"], i;
  for (i = 0; i < 9; i++) { put(b, i, 0, "b", back[i]); put(b, i, 9, "r", back[i]); }
  put(b, 1, 2, "b", "C"); put(b, 7, 2, "b", "C");
  put(b, 1, 7, "r", "C"); put(b, 7, 7, "r", "C");
  [0, 2, 4, 6, 8].forEach(function (x) { put(b, x, 3, "b", "P"); put(b, x, 6, "r", "P"); });
  return b;
}
function inBoard(x, y) { return x >= 0 && x < 9 && y >= 0 && y < 10; }
function inPalace(x, y, side) {
  if (x < 3 || x > 5) return false;
  return side === "r" ? (y >= 7 && y <= 9) : (y >= 0 && y <= 2);
}
function crossedRiver(x, y, side) { return side === "r" ? y <= 4 : y >= 5; }
function cloneBoard(b) { return b.map(function (row) { return row.map(function (p) { return p ? { s: p.s, t: p.t } : null; }); }); }

/* 伪合法着法：不考虑走后自将（飞将规则在 K 的着法里体现） */
function pseudoMoves(b, x, y) {
  var p = b[y][x], out = [];
  if (!p) return out;
  function add(nx, ny) {
    if (!inBoard(nx, ny)) return;
    var q = b[ny][nx];
    if (!q || q.s !== p.s) out.push({ fx: x, fy: y, tx: nx, ty: ny });
  }
  function slide(dx, dy, isCannon) {
    var nx = x + dx, ny = y + dy, screen = false;
    while (inBoard(nx, ny)) {
      var q = b[ny][nx];
      if (!isCannon) {
        if (!q) out.push({ fx: x, fy: y, tx: nx, ty: ny });
        else { if (q.s !== p.s) out.push({ fx: x, fy: y, tx: nx, ty: ny }); break; }
      } else {
        if (!screen) {
          if (!q) out.push({ fx: x, fy: y, tx: nx, ty: ny });
          else screen = true;
        } else {
          if (q) { if (q.s !== p.s) out.push({ fx: x, fy: y, tx: nx, ty: ny }); break; }
        }
      }
      nx += dx; ny += dy;
    }
  }
  var d, nx, ny;
  switch (p.t) {
    case "R": slide(1, 0, false); slide(-1, 0, false); slide(0, 1, false); slide(0, -1, false); break;
    case "C": slide(1, 0, true); slide(-1, 0, true); slide(0, 1, true); slide(0, -1, true); break;
    case "N": {
      var legs = [[0, -1, -1, -2], [0, -1, 1, -2], [0, 1, -1, 2], [0, 1, 1, 2],
                  [-1, 0, -2, -1], [-1, 0, -2, 1], [1, 0, 2, -1], [1, 0, 2, 1]];
      legs.forEach(function (L) {
        var lx = x + L[0], ly = y + L[1];
        if (inBoard(lx, ly) && !b[ly][lx]) add(x + L[2], y + L[3]);
      });
      break;
    }
    case "B": {
      var dirs = [[-2, -2], [2, -2], [-2, 2], [2, 2]];
      dirs.forEach(function (D) {
        nx = x + D[0]; ny = y + D[1];
        if (!inBoard(nx, ny)) return;
        if (p.s === "r" && ny < 5) return;
        if (p.s === "b" && ny > 4) return;
        var ex = x + D[0] / 2, ey = y + D[1] / 2;
        if (b[ey][ex]) return;
        add(nx, ny);
      });
      break;
    }
    case "A":
      [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(function (D) {
        nx = x + D[0]; ny = y + D[1];
        if (inPalace(nx, ny, p.s)) add(nx, ny);
      });
      break;
    case "K": {
      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (D) {
        nx = x + D[0]; ny = y + D[1];
        if (inPalace(nx, ny, p.s)) add(nx, ny);
      });
      /* 飞将：沿列无子阻隔时可直取对方将帅 */
      var dir = p.s === "r" ? -1 : 1;
      ny = y + dir;
      while (inBoard(x, ny)) {
        var q2 = b[ny][x];
        if (q2) { if (q2.t === "K" && q2.s !== p.s) out.push({ fx: x, fy: y, tx: x, ty: ny }); break; }
        ny += dir;
      }
      break;
    }
    case "P": {
      var fwd = p.s === "r" ? -1 : 1;
      add(x, y + fwd);
      if (crossedRiver(x, y, p.s)) { add(x - 1, y); add(x + 1, y); }
      break;
    }
  }
  return out;
}
function findKing(b, side) {
  for (var y = 0; y < 10; y++) for (var x = 0; x < 9; x++) {
    var p = b[y][x];
    if (p && p.t === "K" && p.s === side) return { x: x, y: y };
  }
  return null;
}
function isInCheck(b, side) {
  var k = findKing(b, side);
  if (!k) return true;
  var enemy = side === "r" ? "b" : "r";
  for (var y = 0; y < 10; y++) for (var x = 0; x < 9; x++) {
    var p = b[y][x];
    if (p && p.s === enemy) {
      var ms = pseudoMoves(b, x, y);
      for (var i = 0; i < ms.length; i++) if (ms[i].tx === k.x && ms[i].ty === k.y) return true;
    }
  }
  return false;
}
function applyOn(b, m) {
  var cap = b[m.ty][m.tx];
  b[m.ty][m.tx] = b[m.fy][m.fx];
  b[m.fy][m.fx] = null;
  return cap;
}
function legalMoves(b, side) {
  var out = [];

  if (mode === "pvc" && turn === "b") return;
  var rect = layer.getBoundingClientRect();
  var gx = Math.round((ev.clientX - rect.left) / rect.width * 8);
  var gy = Math.round((ev.clientY - rect.top) / rect.height * 9);
  if (gx < 0 || gx > 8 || gy < 0 || gy > 9) return;
  if (selected) {
    for (var i = 0; i < selected.moves.length; i++) {
      var mv = selected.moves[i];
      if (mv.tx === gx && mv.ty === gy) { doMove(mv); return; }
    }
  }
  var p = board[gy][gx];
  if (p && p.s === turn) {
    var all = legalMoves(board, turn);
    selected = { x: gx, y: gy, moves: all.filter(function (m) { return m.fx === gx && m.fy === gy; }) };
  } else selected = null;
  render();
});
$("undoBtn").addEventListener("click", undo);
$("restartBtn").addEventListener("click", restart);
$("modePvp").addEventListener("click", function () { setMode("pvp"); });
$("modePvc").addEventListener("click", function () { setMode("pvc"); });
$("overlayRestart").addEventListener("click", restart);
$("overlayClose").addEventListener("click", function () { $("overlay").className = "overlay"; });

drawGrid();
render();
</script>
</body>
</html>
